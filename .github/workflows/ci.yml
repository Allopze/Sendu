name: CI

"on":
  pull_request: {}
  push:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks on repository contents
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            dir . --no-git --config .gitleaks.toml --redact --report-format sarif --report-path gitleaks-report.sarif

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif

  build-test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Backend tests with coverage
        run: npm run test:coverage

      - name: Backend audit
        run: npm audit --omit=dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:e2e:smoke

      - name: Frontend audit
        run: npm audit --omit=dev --prefix frontend
