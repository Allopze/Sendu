# Docker Compose for Sendu v2 Release
# Ready to use - just edit .env and run: docker compose up -d --build

services:
  sendu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sendu-app
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-4000}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-lax}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - DEBUG_SESSION=${DEBUG_SESSION:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-sendu.sid}
    volumes:
      - sendu-data:/app/data
      - sendu-uploads:/app/uploads
      - sendu-logs:/app/backend/logs
      - sendu-branding:/app/branding
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-4000}/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/tmp:size=256m

volumes:
  sendu-data:
  sendu-uploads:
  sendu-logs:
  sendu-branding:
