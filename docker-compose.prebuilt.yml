# Docker Compose for Sendu v2 Release
# Ready to use - just edit .env and run: docker compose up -d --build

services:
  sendu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sendu-app
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4000}:${PORT:-4000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-4000}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      - ADMIN_BOOTSTRAP_TOKEN=${ADMIN_BOOTSTRAP_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-lax}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - DEBUG_SESSION=${DEBUG_SESSION:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-sendu.sid}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backend/logs:/app/backend/logs
      - ./branding:/app/branding
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-4000}/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
      - /app/tmp:size=256m,uid=1000,gid=1000
